<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Baara Pro : trouvez un ouvrier vérifié près de chez vous. Prototype créé par Ousmane CAMARA.">
<meta name="theme-color" content="#12285A">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Baara Pro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
/* Concept: une appli de poche, une colonne, gros boutons. Bleu de chantier + orange de sécurité.
   Atkinson Hyperlegible pour lire facilement, Bricolage Grotesque pour les titres. */
:root{
  --font-display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#E8ECF3; --surface:#FFFFFF; --surface-2:#F2F5FA; --ink:#0E1B38; --muted:#55617B; --line:#D6DDE9;
  --brand:#14295C; --hero:#12285A; --on-hero:#FFFFFF; --on-hero-muted:#B9C6E6; --hero-accent:#FFA366;
  --accent:#D9480F; --on-accent:#FFFFFF; --accent-soft:#FDEBDD; --accent-ink:#9A3412;
  --verif-bg:#E1EAFB; --verif-fg:#14295C;
  --star:#E39A00; --star-off:#C5CCDB;
  --bubble-out:#14295C; --bubble-out-ink:#FFFFFF;
  --err:#B42318; --shadow:0 1px 2px rgba(14,27,56,.08);
  --tile1a:#1B3A7A; --tile1b:#0E1B38; --tile2a:#C2410C; --tile2b:#7C2D12; --tile3a:#3B4A6B; --tile3b:#1E2A47;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060C1A; --surface:#0F1A33; --surface-2:#172544; --ink:#EAF0FB; --muted:#9DABC8; --line:#263759;
    --brand:#A9C0F5; --hero:#16306B;
    --accent:#FF7A33; --on-accent:#1A0D03; --accent-soft:#3A2214; --accent-ink:#FFB27F;
    --verif-bg:#1E3566; --verif-fg:#C4D5FF;
    --star:#F5B332; --star-off:#3A4A6E;
    --bubble-out:#2B4C9B; --err:#FF8A80; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060C1A; --surface:#0F1A33; --surface-2:#172544; --ink:#EAF0FB; --muted:#9DABC8; --line:#263759;
  --brand:#A9C0F5; --hero:#16306B;
  --accent:#FF7A33; --on-accent:#1A0D03; --accent-soft:#3A2214; --accent-ink:#FFB27F;
  --verif-bg:#1E3566; --verif-fg:#C4D5FF;
  --star:#F5B332; --star-off:#3A4A6E;
  --bubble-out:#2B4C9B; --err:#FF8A80; --shadow:none;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body.home::before{background:var(--hero)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{flex:0 0 auto;display:block}

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;min-width:0;padding-block:18px 28px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:60px;padding-block:8px}
.top.hero{position:static;display:block;background:var(--hero);color:var(--on-hero);border-bottom:0;padding-block:16px 22px}
.top-title{flex:1;min-width:0;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);color:var(--ink)}
.top-id{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.top-id b{font-family:var(--font-display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-id span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hero-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:25px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;margin-top:5px;font-family:var(--font-body);font-weight:400;font-size:12px;letter-spacing:.03em;color:var(--on-hero-muted)}
.where{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 28px 0 11px;border:1px solid color-mix(in srgb,var(--on-hero) 35%,transparent);border-radius:999px;font-size:14px;font-weight:700}
.where:focus-within{outline:3px solid var(--hero-accent);outline-offset:2px}
.where-sel{appearance:none;-webkit-appearance:none;min-width:0;max-width:150px;padding:8px 0;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.where-sel:focus-visible{outline:none}
.where-sel option{color:var(--ink);background:var(--surface)}
.where .caret{position:absolute;right:9px;pointer-events:none}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
.logo{--logo-tile:#12285A;--logo-helmet:#FF7A33;--logo-check:#12285A;flex:0 0 auto;display:block;border-radius:22%;box-shadow:0 0 0 1px var(--line)}
.logo .lt{fill:var(--logo-tile)}
.logo .lh{fill:var(--logo-helmet)}
.logo .lw{fill:#FFFFFF}
.logo .lg{fill:none;stroke:var(--logo-tile);stroke-width:.9}
.logo .lc{fill:none;stroke:var(--logo-check);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top.hero .logo{--logo-tile:#FF7A33;--logo-helmet:#12285A;--logo-check:#12285A;box-shadow:none}
.hero-h{margin:24px 0 16px;font-family:var(--font-display);font-weight:800;font-size:clamp(27px,8vw,33px);line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
.hero-h span{color:var(--hero-accent)}
.search{display:flex;gap:8px}
.search-in{flex:1;min-width:0;height:52px;padding:0 14px;border:0;border-radius:var(--r);background:var(--surface);color:var(--ink)}
.search-in::placeholder{color:var(--muted)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:2px solid transparent;border-radius:var(--r);font-weight:700;font-size:16px;text-align:center}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-block{width:100%}
.btn-lg{min-height:56px;font-family:var(--font-display);font-weight:800;font-size:19px}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Sections */
.sec{margin-bottom:28px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-title{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-bottom:12px}
.sec-head .sec-title{margin:0}
.muted{color:var(--muted)}
.center{text-align:center}
.fine{font-size:13.5px;color:var(--muted);margin-top:10px}
.lead{margin-bottom:18px;max-width:60ch}

/* Métiers */
.trades{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.trade{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding:12px 2px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:12px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;text-align:center}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.credit{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-family:var(--font-display);font-weight:800;font-size:16px;text-align:center}
.credit span{font-family:var(--font-body);font-weight:400;font-size:14px;color:var(--muted)}

/* Choix du type de compte et espace entreprise */
.band-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.band-btns .btn{padding:8px 10px;line-height:1.2}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);text-align:left}
.choice-ic{display:grid;place-items:center;width:52px;height:52px;flex:0 0 auto;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink)}
.choice-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.choice-tx b{font-family:var(--font-display);font-weight:800;font-size:19px}
.choice-tx span{font-size:14px;color:var(--muted)}
.choice>.ic{color:var(--muted)}
.avatar.co{border-radius:var(--r)}
.fav-btn{margin-bottom:24px}
.fav-btn[aria-pressed="true"]{border-color:var(--star)}
.fav-btn[aria-pressed="true"] .ic{fill:var(--star);stroke:var(--star)}
.team{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.member{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:700}
.member span{margin-left:auto;font-weight:400;font-size:13.5px;color:var(--muted)}
.team-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

/* Espace administrateur */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:700}
.who{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:26px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);text-align:left}
.stat b{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.hot{background:var(--accent-soft);border-color:var(--accent)}
.stat.hot span{color:var(--accent-ink)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(84px,130px) minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:14px}
.bar-l{overflow-wrap:anywhere;line-height:1.2}
.bar{display:block;height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar-n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pend{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.pend-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pend-id{display:flex;flex-direction:column;min-width:0;font-size:14px;color:var(--muted)}
.pend-id b{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--ink);overflow-wrap:anywhere}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.doc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.doc.ok{background:var(--verif-bg);color:var(--verif-fg)}
.doc.no{background:var(--accent-soft);color:var(--accent-ink)}
.pend-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.afilters{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.arow-main{display:flex;flex-direction:column;min-width:0;font-size:13.5px;color:var(--muted)}
.arow-main b{font-size:15.5px;color:var(--ink);overflow-wrap:anywhere}
.arow-act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.state{padding:2px 9px;border-radius:999px;background:var(--verif-bg);color:var(--verif-fg);font-size:12.5px;font-weight:700}
.state.off{background:var(--accent-soft);color:var(--accent-ink)}
.trade-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:var(--r);background:var(--surface);color:var(--brand);border:1px solid var(--line)}
.trade:hover,.trade:focus-visible{border-color:var(--accent)}

/* Cartes d'ouvriers */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.avatar{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:var(--verif-bg);color:var(--verif-fg);font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.02em;flex:0 0 auto}
.avatar.big{width:76px;height:76px;font-size:27px}
.avatar.sm{width:40px;height:40px;font-size:15px}
.card-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.card-name{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.card-sub{font-size:14.5px;color:var(--muted)}
.card-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px;font-size:13px;color:var(--muted)}
.card-rate{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--muted)}
.rate-num{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--ink);line-height:1}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 6px;border-radius:999px;background:var(--verif-bg);color:var(--verif-fg);font-size:12.5px;font-weight:700;white-space:nowrap}
.new{padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:700}
.stars{position:relative;display:inline-block;font-size:15px;line-height:1;letter-spacing:1px;color:var(--star-off);white-space:nowrap}
.stars::before{content:"★★★★★"}
.stars i{position:absolute;inset:0 auto 0 0;width:var(--p);overflow:hidden;color:var(--star);font-style:normal;white-space:nowrap}
.stars i::before{content:"★★★★★"}

/* Bandeau ouvrier */
.join-band{padding:18px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink)}
.join-band h2{font-family:var(--font-display);font-weight:800;font-size:21px;margin-bottom:6px}
.join-band p{margin-bottom:14px;max-width:46ch}

/* Filtres et résultats */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.filters .field{margin:0;min-width:0}
.qchip{margin-bottom:12px;font-size:15px}
.count{margin-bottom:10px;font-size:14.5px;color:var(--muted)}
.empty{padding:24px 16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.empty h3{font-family:var(--font-display);font-weight:800;font-size:19px;margin-bottom:6px}
.empty p{margin-bottom:14px;color:var(--muted)}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700;font-size:15px}
.help{font-size:13.5px;color:var(--muted)}
.err{font-size:14px;font-weight:700;color:var(--err)}
.input{width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface-2);color:var(--ink)}
textarea.input{min-height:110px;padding:10px 12px;resize:vertical;line-height:1.4}
.input:focus{border-color:var(--accent)}
select.input{padding-right:8px;font-size:15px}
input[type=file].input{padding:10px;font-size:14px}
input[type=file]::file-selector-button{margin-right:10px;padding:8px 12px;border:0;border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}

/* Étapes */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 20px}
.step{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.step i{display:block;height:6px;border-radius:3px;background:var(--line)}
.step.done i{background:var(--brand)}
.step.now i{background:var(--accent)}
.step.now,.step.done{color:var(--ink);font-weight:700}

/* Profil */
.p-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.p-name{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.05;letter-spacing:-.015em;overflow-wrap:anywhere}
.p-sub{margin:4px 0 6px;color:var(--muted)}
.rate-line{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.rate-line b{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--ink)}
.verif{display:flex;align-items:flex-start;gap:10px;margin-bottom:24px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:14px;color:var(--muted)}
.verif .badge{margin-top:1px}
.bio{max-width:60ch}
.exp-line{margin-top:6px;font-weight:700}
.gallery{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.tile{position:relative;flex:0 0 156px;height:116px;margin:0;border-radius:var(--r);overflow:hidden;scroll-snap-align:start;color:#fff;background:linear-gradient(135deg,var(--tile1a),var(--tile1b))}
.tile.t1{background:linear-gradient(135deg,var(--tile2a),var(--tile2b))}
.tile.t2{background:linear-gradient(135deg,var(--tile3a),var(--tile3b))}
.tile-ic{position:absolute;right:8px;top:8px;opacity:.28}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:13.5px;font-weight:700;line-height:1.2;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.review{padding:12px 0;border-top:1px solid var(--line)}
.rv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.rv-top b{overflow-wrap:anywhere}
.rate-cta{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.rate-cta p{margin-bottom:10px}

/* Messagerie */
.note{padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:14px;margin-bottom:14px}
.msgs{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:82%;padding:9px 12px;border-radius:14px;overflow-wrap:anywhere;line-height:1.35}
.bubble.out{align-self:flex-end;background:var(--bubble-out);color:var(--bubble-out-ink);border-bottom-right-radius:4px}
.bubble.in{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble .t{display:block;margin-top:2px;font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.bubble.typing{color:var(--muted);font-style:italic}
.composer{display:flex;gap:8px;align-items:center}
.composer .input{flex:1;min-width:0}
.send{width:48px;height:48px;flex:0 0 auto;display:grid;place-items:center;border:0;border-radius:var(--r);background:var(--accent);color:var(--on-accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:14px}
.chip:hover{border-color:var(--accent)}
.conv .card-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Note */
.starpick{display:flex;gap:4px;margin:6px 0 4px}
.starpick button{width:54px;height:54px;padding:0;border:0;background:none;font-size:42px;line-height:1;color:var(--star-off)}
.starpick button.on{color:var(--star)}
.rate-label{min-height:24px;margin-bottom:16px;font-weight:700}

/* Barre du bas */
.dock{position:sticky;bottom:0;z-index:5;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:4px;border:0;border-radius:var(--r);background:none;color:var(--muted);font-size:12.5px;font-weight:700;line-height:1.1;text-align:center}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:20;transform:translateX(-50%);max-width:min(92vw,420px);padding:11px 16px;border-radius:var(--r);background:var(--ink);color:var(--surface);font-weight:700;text-align:center}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

      const note=Math.min(4.9,Math.max(3.9,Math.round((b.note+(((b.id*7+k*3)%5)-2)/10)*10)/10));
      OUVRIERS.push(Object.assign({},b,{
        id:id++,ville:v.id,
        nom:`${PRE[n%25]} ${NOM[(n*7+3+Math.floor(n/25)*5)%25]}`,
        quartier:v.q[(b.id+k)%v.q.length],
        note,nb:Math.max(3,b.nb+((b.id*(k+1))%7)-3),
        chantiers:b.chantiers.slice(),avis:b.avis.map(a=>a.slice())
      }));
    });
  });
})();

function filtered(){
  let nq=norm(filters.q);
  if(nq.length>3) nq=nq.replace(/s$/,'');

  return OUVRIERS.filter(o=>
    o.ville===ville&&!o.suspendu&&
    (!filters.metier||o.metier===filters.metier)&&
    (!filters.quartier||o.quartier===filters.quartier)&&

    (!nq||norm(o.nom+' '+metierNom(o.metier)+' '+o.quartier).includes(nq))

}
function vChat(id){

    top:`${backBtn()}<span class="avatar sm">${esc(initials(o.nom))}</span>

      <button class="btn btn-ghost btn-sm" data-act="rate" data-id="${o.id}">Noter</button>`,
    body:`${coOk()?`<p class="who"><span class="badge">${ic('shield',14)}Entreprise vérifiée</span><span>Vous écrivez au nom de ${esc(co.nom)}</span></p>`:''}<p class="note">Démonstration : les réponses de ${esc(first)} sont simulées.</p>
      <div class="msgs" id="msgs">${bubbles(c,o)}</div>`,
    dock:`${sent?'':`<div class="chips" id="chips">${QUICK.map(q=>`<button class="chip" data-act="quick" data-text="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}

        <input id="chatInput" class="input" type="text" maxlength="500" placeholder="Écrire un message" aria-label="Votre message">
        <button class="send" type="submit" aria-label="Envoyer">${ic('send',22)}</button>
      </form>`
  };
}
function replyFor(text){
  const t=norm(text);
  if(/prix|tarif|combien|cout/.test(t)) return `Ça dépend du chantier. Envoyez-moi le lieu et ce qu'il y a à faire, et je vous donne un prix.`;
  if(/disponible|libre|semaine|quand/.test(t)) return `Oui, je suis libre à partir de lundi. C'est dans quel quartier ?`;
  if(/passer|chantier|visite|voir/.test(t)) return `Oui, je peux passer demain matin voir le chantier.`;
  return `Bonjour ! Dites-moi ce dont vous avez besoin et où se trouve le chantier.`;
}
function refreshChat(id){
  if(cur.view==='chat'&&cur.params.id===id){
    const o=byId(id), c=chat(id), box=$('#msgs');
    if(box){
      box.innerHTML=bubbles(c,o);
      const chips=$('#chips'); if(chips&&c.msgs.some(m=>m.from==='me')) chips.remove();
      window.scrollTo({top:document.documentElement.scrollHeight});
    }
  } else if(cur.view==='messages'){ render(); }
}
function sendMsg(id,text){
  text=String(text||'').trim(); if(!text) return;
  const c=chat(id);
  c.msgs.push({from:'me',text,t:now()});
  c.typing=true;
  refreshChat(id);
  setTimeout(()=>{
    c.msgs.push({from:'them',text:replyFor(text),t:now()});
    c.typing=false;
    refreshChat(id);
  },1200);
}
function vMessages(){
  const ids=Object.keys(chats).map(Number).filter(i=>chats[i].msgs.length&&byId(i));
  ids.sort((a,b)=>chats[b].msgs.length-chats[a].msgs.length);
  const body=ids.length
    ?`<div class="list">${ids.map(i=>{
        const o=byId(i), last=chats[i].msgs[chats[i].msgs.length-1];
        return `<button class="card conv" data-act="chat" data-id="${i}">
          <span class="avatar">${esc(initials(o.nom))}</span>
          <span class="card-main"><span class="card-name">${esc(o.nom)}</span><span class="card-sub">${esc(last.text)}</span></span>
          <span class="when">${last.t}</span></button>`;
      }).join('')}</div>`
    :`<div class="empty"><h3>Aucune conversation</h3><p>Choisissez un métier, ouvrez un profil et touchez « Contacter ».</p><button class="btn btn-primary" data-act="tab" data-view="home">Trouver un ouvrier</button></div>`;

}

function approve(pid){
  const p=PENDING.find(x=>x.id===pid); if(!p) return null;
  if(p.type==='entreprise'){
    const e={id:nextCoId++,kind:'entreprise',nom:p.nom,secteur:p.secteur,ville:p.ville,resp:p.resp,mine:!!p.mine};
    ENTREPRISES.push(e);
    PENDING.splice(PENDING.indexOf(p),1);
    if(p.mine&&co){co.status='verifie';co.coId=e.id;}
    return e;
  }
  const o={id:nextId++,nom:p.nom,metier:p.metier,ville:p.ville,quartier:p.quartier,note:0,nb:0,exp:null,mine:true,
    bio:`Nouveau sur Baara Pro.`,
    chantiers:Array.from({length:Math.min(p.photos,6)},(_,i)=>`Photo ${i+1}`),avis:[]};
  OUVRIERS.push(o);
  PENDING.splice(PENDING.indexOf(p),1);
  if(p.mine&&me){me.status='verifie';me.workerId=o.id;}
  return o;
}
function reject(pid,reason){
  const p=PENDING.find(x=>x.id===pid); if(!p) return;
  PENDING.splice(PENDING.indexOf(p),1);
  if(p.type==='entreprise'){ if(p.mine&&co){co.status='refuse';co.reason=reason;} return; }
  if(p.mine&&me){me.status='refuse';me.reason=reason;}
}

/* ---------- Affichage ---------- */
function render(){
  const v=cur.view, p=cur.params;
  let r;
  if(v==='home') r=vHome();
  else if(v==='list') r=vList();
  else if(v==='profile') r=vProfile(p.id);
  else if(v==='chat') r=vChat(p.id);
  else if(v==='messages') r=vMessages();
  else if(v==='metiers') r=vMetiers();
  else if(v==='adminlogin') r=vAdminLogin();
  else if(v==='admin') r=vAdmin(p.tab);
  else if(v==='rate') r=vRate(p.id);
  else r=vJoin();
  if(!r){cur={view:'home',params:{}};stack=[];return render();}
  document.body.classList.toggle('home',v==='home');
  const top=$('#top'), dock=$('#dock');
  top.className='top pad'+(v==='home'?' hero':'');
  top.innerHTML=r.top;
  $('#screen').innerHTML=r.body;
  dock.innerHTML=r.dock||'';
  dock.hidden=!r.dock;
  window.scrollTo(0,0);
  if(v==='chat'&&chat(p.id).msgs.length) window.scrollTo({top:document.documentElement.scrollHeight});
}

let toastTimer;
function toast(m){
  const t=$('#toast'); t.textContent=m; t.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.hidden=true},2600);
}

  tab:el=>{if(el.dataset.view==='join') joinType=''; tab(el.dataset.view);},
  jtype:el=>{joinType=el.dataset.t||'';stack=[];cur={view:'join',params:{}};render();},
  trade:el=>{resetFilters();filters.metier=el.dataset.id;go('list');},
  all:()=>{resetFilters();go('list');},
  metiers:()=>go('metiers'),
  joinAs:el=>{joinPrefill=el.dataset.id;joinType='ouvrier';tab('join');},
  open:el=>go('profile',{id:+el.dataset.id}),
  contact:el=>go('chat',{id:+el.dataset.id}),
  chat:el=>go('chat',{id:+el.dataset.id}),
  rate:el=>{rateN=0;go('rate',{id:+el.dataset.id});},
  star:el=>setStars(+el.dataset.n),
  quick:el=>sendMsg(cur.params.id,el.dataset.text),
  clearq:()=>{filters.q='';render();},
  reset:()=>{resetFilters();render();},
  validate:()=>{
    if(me&&me.pid) approve(me.pid);
    render();
  },
  retry:()=>{me=null;joinType='ouvrier';render();},
  retryCo:()=>{co=null;joinType='entreprise';render();},
  validateCo:()=>{
    if(co&&co.status==='attente') approve('pc');
    render();
  },
  fav:el=>{
    if(!coOk()) return;
    const id=+el.dataset.id, i=co.fav.indexOf(id);
    if(i>=0) co.fav.splice(i,1); else co.fav.push(id);
    el.outerHTML=favBtn(id);
    toast(i>=0?`Retiré de vos favoris.`:`Ajouté à vos favoris. Retrouvez-le dans Mon compte.`);
  },
  togglec:el=>{
    const e=ENTREPRISES.find(x=>x.id===+el.dataset.id); if(!e) return;
    e.suspendu=!e.suspendu;
    const box=$('#erows'); if(box) box.innerHTML=entreprisesHtml();
    toast(e.suspendu?`${e.nom} est suspendue.`:`${e.nom} est de nouveau active.`);
  },
  alogin:()=>{if(admin){stack=[];cur={view:'admin',params:{tab:'resume'}};render();}else go('adminlogin');},
  aquit:()=>{admin=false;tab('home');},
  atab:el=>{stack=[];cur={view:'admin',params:{tab:el.dataset.tab}};render();},
  approve:el=>{
    const o=approve(el.dataset.pid);
    if(o) toast(o.kind==='entreprise'?`${o.nom} est validée. Elle a le badge Entreprise vérifiée.`:`${o.nom} est validé et visible dans la recherche.`);
    render();
  },
  reject:el=>{
    const pid=el.dataset.pid, sel=document.getElementById('r-'+pid);
    const p=PENDING.find(x=>x.id===pid);
    reject(pid,sel?sel.value:'Autre raison');
    if(p) toast(`Le profil de ${p.nom} est refusé.`);
    render();
  },
  toggle:el=>{
    const o=byId(+el.dataset.id); if(!o) return;
    o.suspendu=!o.suspendu;
    const box=$('#arows'); if(box) box.innerHTML=adminRowsHtml();
    toast(o.suspendu?`${o.nom} est suspendu. Il n'apparaît plus dans la recherche.`:`${o.nom} est de nouveau visible.`);
  },
  seeMine:()=>{
    resetFilters(); ville=me.ville; filters.metier=me.metier; filters.quartier=me.quartier;
    go('list');
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const f=A[el.dataset.act]; if(f) f(el);
});

document.addEventListener('change',e=>{
  const tg=e.target;
  if(tg.id==='villeSel'){ville=tg.value;filters.quartier='';render();return;}
  if(tg.id==='jVille'){joinVille=tg.value;const q=$('#jQuartier');if(q)q.innerHTML=quartierOpts(tg.value);return;}
  if(tg.id==='aVille'){af.ville=tg.value;const b=$('#arows');if(b)b.innerHTML=adminRowsHtml();return;}
  const k=tg.dataset&&tg.dataset.filter; if(!k) return;
  filters[k]=e.target.value;
  const res=$('#results'); if(res) res.innerHTML=resultsHtml();
  const t=$('.top-title'); if(t) t.textContent=listTitle();
});

document.addEventListener('input',e=>{
  if(e.target.id==='aQ'){af.q=e.target.value;const b=$('#arows');if(b)b.innerHTML=adminRowsHtml();}
});

document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='searchForm'){
    const q=$('#q').value.trim();
    resetFilters(); filters.q=q; go('list');
  } else if(id==='chatForm'){
    const inp=$('#chatInput'); const t=inp.value; inp.value='';
    sendMsg(cur.params.id,t);
  } else if(id==='joinForm'){
    const f=e.target, d=f.elements;
    const bad={
      nom:!d.nom.value.trim(),
      metier:!d.metier.value,
      quartier:!d.quartier.value,
      tel:d.tel.value.replace(/\D/g,'').length<8,
      piece:!(d.piece.files&&d.piece.files.length)
    };
    let first=null;
    Object.keys(bad).forEach(k=>{
      const m=f.querySelector('.err[data-for="'+k+'"]'); if(m) m.hidden=!bad[k];
      if(bad[k]&&!first) first=d[k];
    });
    if(first){first.focus();return;}
    me={nom:d.nom.value.trim(),metier:d.metier.value,ville:d.ville.value,quartier:d.quartier.value,
        photos:d.photos.files?d.photos.files.length:0,status:'attente',workerId:null,pid:'pm'};
    PENDING.unshift({id:'pm',nom:me.nom,metier:me.metier,ville:me.ville,quartier:me.quartier,tel:d.tel.value.trim(),photos:me.photos,mine:true});
    render();
  } else if(id==='coForm'){
    const f=e.target, d=f.elements;
    const bad={
      nom:!d.nom.value.trim(),
      secteur:!d.secteur.value,
      resp:!d.resp.value.trim(),
      tel:d.tel.value.replace(/\D/g,'').length<8,
      doc:!(d.doc.files&&d.doc.files.length)
    };
    let first=null;
    Object.keys(bad).forEach(k=>{
      const m=f.querySelector('.err[data-for="'+k+'"]'); if(m) m.hidden=!bad[k];
      if(bad[k]&&!first) first=d[k];
    });
    if(first){first.focus();return;}
    co={nom:d.nom.value.trim(),secteur:d.secteur.value,ville:d.ville.value,resp:d.resp.value.trim(),
        status:'attente',coId:null,fav:[],team:[]};
    PENDING.unshift({id:'pc',type:'entreprise',nom:co.nom,secteur:co.secteur,ville:co.ville,resp:co.resp,tel:d.tel.value.trim(),mine:true});
    render();
  } else if(id==='teamForm'){
    const inp=$('#tName'), n=inp.value.trim();
    if(!n){inp.focus();return;}
    if(co) co.team.push(n);
    const box=$('#teamBox'); if(box) box.innerHTML=teamHtml();
    inp.value=''; inp.focus();
    toast(`${n} est ajouté à l'équipe.`);
  } else if(id==='adminForm'){
    const c=$('#aCode').value.trim().toLowerCase();
    if(c==='baara'){admin=true;stack=[];cur={view:'admin',params:{tab:'resume'}};render();}
    else{const er=$('#aErr');if(er)er.hidden=false;}
  } else if(id==='rateForm'){
    if(rateN<1) return;
    const o=byId(cur.params.id); if(!o) return;
    const comment=$('#rComment').value.trim();
    o.note=(o.note*o.nb+rateN)/(o.nb+1);
    o.nb+=1;
    o.avis.unshift([`Vous`,rateN,comment]);
    toast(`Merci, votre avis est publié.`);
    if(stack.length&&stack[stack.length-1].view==='profile'&&stack[stack.length-1].params.id===o.id) stack.pop();
    cur={view:'profile',params:{id:o.id}};
    render();
  }
});

render();
})();
</script>

</body>
</html>
